# Network devices: physical hardware addressed by IP on the LAN.
#
# Only `ip` is consumed today; `id` and `room` are kept for future use
# (per-device labels, room mapping matching `config/sensors.yaml`) and
# to keep entries self-documenting.

daikin:
  - id: daikin_salon
    ip: 192.168.1.73
    room: salon
  - id: daikin_cuisine
    ip: 192.168.1.84
    room: cuisine
