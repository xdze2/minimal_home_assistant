<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MiniHA Temperature Graph</title>
    <link rel="stylesheet" href="modern.css" />
    <link rel="stylesheet" href="uPlot.min.css" />
    <style></style>
  </head>
  <body>
    <script src="uPlot.iife.min.js"></script>

    <h1>Mini HA</h1>

    <div class="controls">
      <label for="day">Day:</label>
      <input type="date" id="day" name="day" />
    </div>

    <h2>Linky</h2>

    <div id="chart"></div>

    <script>
      function getTodayISO() {
        const d = new Date();
        return d.toISOString().slice(0, 10);
      }

      const dayInput = document.getElementById("day");
      dayInput.value = getTodayISO();

      function fetchAndDraw(day) {
        fetch(`/linky?day=${day}`)
          .then((res) => res.json())
          .then((jsonObj) => {
            const data = jsonObj.data;
            if (!data || data.length === 0) {
              document.getElementById("chart").innerText = "No data";
              return;
            }

            // Parse ISO time string to minutes since midnight
            const hours = data.map((row) => {
              // row.time is ISO string, e.g. "2024-06-01T12:34:56.000Z"
              const dt = new Date(row.time);
              return dt ? dt.getHours() + dt.getMinutes() / 60 : null;
            });

            const apparentPower = data.map((row) => row.apparent_power);

            console.log(hours);
            console.log(apparentPower);

            const opts = {
              title: "Apparent Power over Time",
              width: 600,
              height: 300,
              scales: { x: { time: false } },
              series: [
                {
                  label: "Time",
                },
                {
                  label: "Apparent Power",
                  stroke: "rgba(5, 141, 199, 1)",
                  fill: "rgba(5, 141, 199, 0.1)",
                },
              ],
              axes: [
                {
                  label: "Time (HH:MM)",
                },
                { label: "Apparent Power" },
              ],
            };

            // Remove previous chart if exists
            const chartDiv = document.getElementById("chart");
            chartDiv.innerHTML = "";
            const dataArr = [hours, apparentPower];
            new uPlot(opts, dataArr, chartDiv);
          })
          .catch((err) => {
            document.getElementById("chart").innerText = "Failed to load data";
            console.error(err);
          });
      }

      dayInput.addEventListener("change", (e) => {
        fetchAndDraw(e.target.value);
      });

      // Initial load
      fetchAndDraw(dayInput.value);
    </script>
  </body>
</html>
