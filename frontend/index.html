<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MiniHA Temperature Graph</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="uPlot.min.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
      }
      h1 {
        margin: 0;
        padding: 0.5em 1em;
        background: #fff;
        border-bottom: 1px solid #eee;
      }
      .main-content {
        padding: 0 1em;
      }
      .chart {
        width: 90%;
        max-width: 800px;
        margin: auto;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(17, 21, 27, 0.08);
        padding: 1em;
        margin-bottom: 1em;
      }
      .chart canvas {
        display: block;
      }
      .month-overview {
        margin: 1em auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(60, 72, 88, 0.08);
        padding: 0.5em;
        overflow-x: auto;
      }
      .month-table {
        border-collapse: collapse;
        font-size: 0.7em;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .month-table th,
      .month-table td {
        padding: 1px 3px;
        text-align: center;
        border-bottom: 1px solid #f0f0f0;
        white-space: nowrap;
      }
      .month-table th[scope="row"] {
        text-align: right;
        font-weight: 600;
        background: #f0f6ff;
        position: sticky;
        left: 0;
        z-index: 1;
        padding-right: 0.5em;
      }
      .month-table td {
        min-width: 1.6em;
        transition: background 0.15s;
      }
      .month-table td.date {
        font-family: monospace;
        font-weight: 600;
        background: #f8fafc;
      }
      .month-table td.month {
        font-family: monospace;
        background: #f8fafc;
        color: #888;
        font-size: 0.85em;
      }
      .month-table td.weekend {
        color: #888;
      }
      .month-table td.col-selected {
        outline: 2px solid #377eb8;
        outline-offset: -2px;
      }
      .month-table td:hover {
        filter: brightness(0.92);
      }
      .status-dot {
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        vertical-align: middle;
      }
      #monthly-charts {
        display: flex;
        flex-direction: column;
        gap: 0.75em;
        margin-bottom: 0.75em;
      }
      .monthly-chart {
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(60, 72, 88, 0.08);
        padding: 0.4em;
      }
      .monthly-chart-title {
        font-size: 0.85em;
        font-weight: 600;
        margin: 0 0 0.25em 0.25em;
        color: #444;
      }
      #daily-summary {
        max-width: 800px;
        margin: 2em auto 1em auto;
        padding: 1em;
        background: #f8fafc;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(60, 72, 88, 0.06);
      }
    </style>
  </head>
  <body>
    <h1>Mini HA</h1>

    <div class="main-content">
      <h2 style="margin:1em 0 0.25em 0;">Last 60 days</h2>
      <div id="monthly-charts"></div>
      <div class="month-overview">
        <div id="month-overview">Loading…</div>
      </div>
      <h2 style="margin:1.5em 0 0.25em 0;" id="day-detail-title">Selected day</h2>
      <div id="chart"></div>

      <div
        id="daily-summary"
        style="
          max-width: 800px;
          margin: 2em auto 1em auto;
          padding: 1em;
          background: #f8fafc;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(60, 72, 88, 0.06);
        "
      >
        <!-- Daily summary will be injected here -->
      </div>

      <h2>Temperatures</h2>
      <div id="temp-chart"></div>
    </div>
    <script src="uPlot.iife.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
