<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MiniHA Temperature Graph</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="uPlot.min.css" />
    <style>
      #chart {
        width: 90%;
        max-width: 800px;
        margin: auto;
        text-align: center;
      }
      #chart canvas {
        display: block;
      }
      .controls {
        display: flex;
        justify-content: center;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .controls label {
        font-weight: 500;
        margin-right: 0.5em;
      }
      .controls input[type="date"] {
        padding: 0.3em 0.6em;
        border-radius: 4px;
        border: 1px solid #bbb;
        font-size: 1em;
      }
    </style>
  </head>
  <body>
    <h1>Linky Power Graph</h1>
    <div class="controls">
      <label for="day">Day:</label>
      <input type="date" id="day" name="day" />
    </div>
    <div id="chart"></div>
    <h1>Temperatures</h1>
    <div id="temp-chart"></div>
    <script src="uPlot.iife.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
