<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MiniHA Temperature Graph</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="uPlot.min.css" />
    <style>
      body {
        display: flex;
        flex-direction: row;
        min-height: 100vh;
      }
      .main-content {
        flex: 1 1 auto;
        padding-right: 320px;
      }
      #sidebar {
        width: 300px;
        background: #f9f9fa;
        border-left: 1px solid #eee;
        padding: 1em;
        margin-right: 1em;
        position: fixed;
        right: 0;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      #sidebar h2 {
        font-size: 1.2em;
        margin-top: 0;
      }
      .event-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .event-list li {
        margin-bottom: 1em;
        padding: 0.5em;
        border-radius: 6px;
        cursor: pointer;
        border-left: 4px solid #377eb8;
        background: #f0f6ff;
        transition: background 0.2s;
      }
      .event-list li.selected {
        background: #dbeafe;
        border-left: 4px solid #e41a1c;
      }
      .event-title {
        font-weight: bold;
      }
      .event-message {
        font-size: 0.95em;
        color: #444;
      }
      .chart {
        width: 90%;
        max-width: 800px;
        margin: auto;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(17, 21, 27, 0.08);
        padding: 1em;
        margin-bottom: 1em;
      }
      .chart canvas {
        display: block;
      }
      .calendar-container {
        display: flex;
        justify-content: center;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .calendar {
        border-collapse: collapse;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(60, 72, 88, 0.08);
        font-size: 1em;
      }
      .calendar th,
      .calendar td {
        width: 2.5em;
        height: 2.5em;
        text-align: center;
        cursor: pointer;
        border: 1px solid #eee;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .calendar th {
        background: #f0f6ff;
        font-weight: 600;
        cursor: default;
      }
      .calendar td.selected {
        background: #377eb8;
        color: #fff;
        font-weight: bold;
      }
      .calendar td.today {
        border: 2px solid #e41a1c;
      }
      .calendar td:hover:not(.selected):not(.empty) {
        background: #dbeafe;
      }
      .calendar td.empty {
        background: transparent;
        cursor: default;
        border: none;
      }
      .calendar-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5em;
      }
      .calendar-nav button {
        background: #377eb8;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 0.2em 0.7em;
        font-size: 1em;
        cursor: pointer;
        margin: 0 0.5em;
      }
      .calendar-nav span {
        font-weight: 600;
        font-size: 1.1em;
      }
      #daily-summary {
        max-width: 800px;
        margin: 2em auto 1em auto;
        padding: 1em;
        background: #f8fafc;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(60, 72, 88, 0.06);
      }
    </style>
  </head>
  <body>
    <h1>Mini HA</h1>

    <div class="main-content">
      <div class="calendar-container">
        <div id="calendar"></div>
      </div>
      <div id="chart"></div>

      <div
        id="daily-summary"
        style="
          max-width: 800px;
          margin: 2em auto 1em auto;
          padding: 1em;
          background: #f8fafc;
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(60, 72, 88, 0.06);
        "
      >
        <!-- Daily summary will be injected here -->
      </div>

      <h1>Temperatures</h1>
      <div id="temp-chart"></div>
    </div>
    <div id="sidebar">
      <h2>Events</h2>
      <ul class="event-list" id="event-list"></ul>
    </div>
    <script src="uPlot.iife.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
